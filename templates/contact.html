{% extends "base.html" %}
{% block title %}Get in Touch{% endblock %}
{% block content %}
<section class="cta-section theme-bg-light py-5">
    <div class="container py-5">
        <div class="text-center mb-5">
            <h2 class="h2 mb-3">{{ contact.title }}</h2>
            <p class="text-muted mx-auto" style="max-width: 550px;">
                {{ contact.description }}
            </p>
        </div>
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <form action="https://getform.io/f/aejrjzwb" method="POST">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">{{ contact.name_label }}</label>
                                <input type="text" name="name" required
                                       placeholder="{{ contact.name_placeholder }}"
                                       class="form-control form-control-lg">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">{{ contact.email_label }}</label>
                                <input type="email" name="email" required
                                       placeholder="{{ contact.email_placeholder }}"
                                       class="form-control form-control-lg">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">{{ contact.message_label }}</label>
                                <textarea name="message" required
                                          placeholder="{{ contact.message_placeholder }}"
                                          class="form-control form-control-lg"
                                          style="min-height: 220px;"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100 mt-3">
                                {{ contact.button_text }}
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
